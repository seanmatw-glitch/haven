<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Haven — Brand System</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #F5EFE6;
    --cream-warm: #FAF6EF;
    --ember: #1F1714;
    --ember-deep: #0c0608;
    --amber: #D4A574;
    --amber-bright: #E8A159;
    --rose: #C98B7A;
    --rose-deep: #D17A6A;
    --sage: #7A8471;
    --plum: #3D2E3F;
    --plum-deep: #5A3E5F;
    --electric: #2B3FC4;
    --terra: #C14A2E;
  }
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: Inter, sans-serif; color: var(--ember); }
  * { box-sizing: border-box; }
  em { font-style: italic; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="brand/logos.jsx"></script>
<script type="text/babel" src="brand/surfaces.jsx"></script>
<script type="text/babel" src="brand/ab-foundation.jsx"></script>
<script type="text/babel" src="brand/ab-logo.jsx"></script>
<script type="text/babel" src="brand/ab-ui.jsx"></script>
<script type="text/babel" src="brand/ab-marketing.jsx"></script>

<script type="text/babel">
const HAVEN_TWEAKS = /*EDITMODE-BEGIN*/{
  "accentHue": "amber"
}/*EDITMODE-END*/;

function HavenBrand() {
  const [tweaks, setTweaks] = useTweaks(HAVEN_TWEAKS);

  // Apply accent hue override to root CSS vars
  React.useEffect(() => {
    const root = document.documentElement;
    const map = {
      amber:    { amber: '#D4A574', bright: '#E8A159' },
      rose:     { amber: '#D17A6A', bright: '#E19580' },
      plum:     { amber: '#8A5F8E', bright: '#A878AC' },
    };
    const c = map[tweaks.accentHue] || map.amber;
    root.style.setProperty('--amber', c.amber);
    root.style.setProperty('--amber-bright', c.bright);
  }, [tweaks.accentHue]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="intro" title="Haven" subtitle="A therapy-engaged AI matchmaker. Brand system, v0.1.">
          <DCArtboard id="cover" label="01 · Cover" width={1600} height={1000}>
            <AB_Cover />
          </DCArtboard>
          <DCArtboard id="sage-moment" label="02 · Sage, typeset" width={1600} height={1000}>
            <AB_SageMoment />
          </DCArtboard>
        </DCSection>

        <DCSection id="foundation" title="Foundation" subtitle="Color and type — the rules that hold everything quiet.">
          <DCArtboard id="color" label="03 · Color system" width={1400} height={1600}>
            <AB_Color />
          </DCArtboard>
          <DCArtboard id="type" label="04 · Typography" width={1400} height={1200}>
            <AB_Type />
          </DCArtboard>
        </DCSection>

        <DCSection id="mark" title="Mark" subtitle="Wordmark-led. A signet, not a badge.">
          <DCArtboard id="logo" label="05 · Wordmark & supporting marks" width={1400} height={1600}>
            <AB_Logo />
          </DCArtboard>
          <DCArtboard id="appicon" label="06 · App icon" width={1400} height={1200}>
            <AB_AppIcon />
          </DCArtboard>
        </DCSection>

        <DCSection id="product" title="Product" subtitle="Key UI moments. Cards feel like paper; Sage feels like light.">
          <DCArtboard id="ui" label="07 · UI surfaces" width={1800} height={1000}>
            <AB_UI />
          </DCArtboard>
        </DCSection>

        <DCSection id="marketing" title="Marketing" subtitle="Out-of-home, social, email.">
          <DCArtboard id="ooh" label="08 · OOH poster" width={900} height={1200}>
            <AB_OOH />
          </DCArtboard>
          <DCArtboard id="social" label="09 · Social · IG" width={1400} height={900}>
            <AB_Social />
          </DCArtboard>
          <DCArtboard id="email" label="10 · Email · match notification" width={1100} height={1200}>
            <AB_Email />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Accent hue" subtitle="Signal color for CTAs, highlights, Sage's warm touch.">
          <TweakRadio
            value={tweaks.accentHue}
            onChange={v => setTweaks({ accentHue: v })}
            options={[
              { value: 'amber', label: 'Signal Amber (default)' },
              { value: 'rose',  label: 'Dusk Rose' },
              { value: 'plum',  label: 'Ink Plum' },
            ]}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<HavenBrand />);
</script>
</body>
</html>
